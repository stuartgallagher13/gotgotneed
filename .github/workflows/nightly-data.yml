# Copies every English club's data from Wikidata/Wikipedia each night and publishes it,
# together with the web version of the app, on GitHub Pages.
#
# One-time setup (repo Settings):
#   1. Secrets and variables > Actions > New repository secret
#        Name: WIKIMEDIA_CONTACT   Value: the email address Wikimedia can contact about this traffic
#   2. Pages > Build and deployment > Source: GitHub Actions
# Then run it once by hand: Actions > Nightly data copy > Run workflow.

name: Nightly data copy

on:
  schedule:
    - cron: '30 3 * * *'        # 03:30 UTC every night
  workflow_dispatch:
    inputs:
      full:
        description: 'Re-copy every season from scratch'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # Last night's copy, so only new data is fetched: GitHub's cache first, then the live site
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Pick up last night's copy
        run: |
          if [ -d data/teams ]; then
            echo "Restored $(ls data/teams | wc -l) clubs from GitHub's cache"
          elif curl -sfL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.tar.gz" -o /tmp/data.tar.gz && tar xzf /tmp/data.tar.gz; then
            echo "Restored $(ls data/teams | wc -l) clubs from the live site"
          else
            echo "No previous copy found, doing a first full build (about 30-60 minutes)"
          fi

      - name: Copy club data
        env:
          CONTACT: ${{ secrets.WIKIMEDIA_CONTACT }}
          FULL: ${{ inputs.full && '--full' || '' }}
        run: |
          if [ -z "$CONTACT" ]; then echo "::error::Add the WIKIMEDIA_CONTACT repository secret first"; exit 1; fi
          # a few clubs failing shouldn't stop the rest being published; they load live and are retried tomorrow
          ruby build_data.rb $FULL || echo "::warning::Some clubs failed to copy, see the log above"

      # keep tonight's copy even if publishing fails, so tomorrow doesn't start from scratch
      - uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/
          tar czf _site/data.tar.gz data
          echo "Publishing $(ls data/teams | wc -l) clubs, $(du -sh data | cut -f1) of data"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Separate job: if GitHub Pages is slow, re-run just this job without rebuilding the data
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
