<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Got Got Need</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--ink:#16181d;--muted:#6b6f78;--card:#fff;--line:#e2ddd2;--accent:#d6372b;--accent2:#1f4fbf;--gold:#e6b422}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
a{color:inherit}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.logo{font-family:Anton,sans-serif;font-size:24px;letter-spacing:.5px;text-decoration:none;white-space:nowrap}
.logo span{color:var(--gold)}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;padding:10px 14px;border-radius:999px;border:0;font:inherit;font-size:15px}
.results{position:absolute;top:44px;left:0;right:0;background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);overflow:hidden;display:none}
.results a{display:block;padding:10px 14px;text-decoration:none;border-bottom:1px solid var(--line)}
.results a:hover,.results a.sel{background:#f3f0e8}
.results small{color:var(--muted);display:block}
main{max-width:1100px;margin:0 auto;padding:32px 24px 64px}
.hero{text-align:center;padding:48px 0 24px}
.hero h1{font-family:Anton,sans-serif;font-size:clamp(40px,7vw,72px);margin:0;line-height:1}
.hero p{color:var(--muted);font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);text-decoration:none;font-weight:600;font-size:14px}
.chip:hover{border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.panel h2{font-family:Anton,sans-serif;font-weight:400;font-size:22px;margin:0 0 12px;letter-spacing:.3px}
.muted{color:var(--muted)}
/* profile */
.profile{display:grid;grid-template-columns:300px 1fr;gap:32px;align-items:start}
.sticker{background:linear-gradient(135deg,#fff 0%,#f7f7f7 100%);border-radius:14px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);transform:rotate(-1.5deg);position:sticky;top:90px}
.sticker .frame{border:4px solid var(--accent2);border-radius:8px;overflow:hidden;position:relative;background:linear-gradient(160deg,#cfe0ff,#7aa2f0)}
.sticker .photo{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;display:block}
.sticker .nophoto{aspect-ratio:3/4;display:grid;place-items:center;font-family:Anton;font-size:80px;color:#fff}
.sticker .num{position:absolute;top:8px;left:8px;background:var(--gold);font-family:Anton;padding:2px 8px;border-radius:4px;font-size:14px}
.sticker .banner{background:var(--accent);color:#fff;font-family:Anton;font-size:24px;text-align:center;padding:8px 6px;text-transform:uppercase;letter-spacing:.5px;line-height:1.05}
.sticker .facts{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;padding:10px 4px 2px}
.sticker .facts b{color:var(--muted);font-weight:600}
.credit{font-size:10px;color:var(--muted);padding:6px 4px 0;line-height:1.3}
.credit a{color:var(--muted)}
h1.name{font-family:Anton,sans-serif;font-weight:400;font-size:48px;margin:0;line-height:1}
.desc{color:var(--muted);margin:6px 0 16px;text-transform:capitalize}
.bio{line-height:1.6}
.section{margin-top:28px}
.section h2{font-family:Anton,sans-serif;font-weight:400;font-size:24px;margin:0 0 12px;border-bottom:3px solid var(--ink);padding-bottom:4px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
th{background:#faf8f3;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.crest{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50% 50% 45% 45%;color:#fff;font-weight:800;font-size:11px;margin-right:10px;vertical-align:middle}
.team a{text-decoration:none;font-weight:600}
.team a:hover{text-decoration:underline}
.loan{font-size:11px;background:#fff3c4;padding:1px 6px;border-radius:4px;margin-left:6px}
.awards{display:flex;flex-wrap:wrap;gap:8px}
.award{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.award b{color:var(--accent)}
.loading{text-align:center;padding:80px;color:var(--muted)}
/* team */
.thead{display:flex;gap:24px;align-items:center;background:var(--ink);color:#fff;border-radius:18px;padding:28px}
.bigcrest{flex:none;display:grid;place-items:center;width:110px;height:120px;border-radius:50% 50% 45% 45%;font-family:Anton;font-size:38px;color:#fff;border:4px solid rgba(255,255,255,.85)}
.thead h1{font-family:Anton,sans-serif;font-weight:400;font-size:clamp(30px,5vw,48px);margin:0;line-height:1}
.tfacts{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:10px;font-size:14px;opacity:.85}
.tfacts b{color:var(--gold);font-weight:600;margin-right:4px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:24px 0 8px}
.controls input,.controls select{padding:9px 14px;border-radius:999px;border:1px solid var(--line);font:inherit;font-size:14px;background:#fff}
.controls input{flex:1;min-width:180px}
.decades{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.decades button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.decades button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.squad{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.mini{background:#fff;border-radius:10px;padding:6px;box-shadow:0 3px 10px rgba(0,0,0,.1);text-decoration:none;transition:transform .15s}
.mini:hover{transform:translateY(-3px) rotate(-1deg)}
.mini .ph{position:relative;aspect-ratio:3/4;border-radius:6px;overflow:hidden;display:grid;place-items:center;font-family:Anton;font-size:34px;color:#fff}
.mini .ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.mini .nm{background:var(--accent);color:#fff;font-family:Anton;font-size:14px;text-transform:uppercase;text-align:center;padding:4px;margin-top:5px;border-radius:4px;line-height:1.1}
.mini .yr{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.count{color:var(--muted);font-size:14px;margin:0 0 12px}
.tabs{display:flex;gap:4px;margin:22px 0 4px;border-bottom:2px solid var(--line)}
.tabs a{padding:10px 16px;text-decoration:none;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs a.on{color:var(--ink);border-color:var(--accent)}
.seasonnav{display:flex;align-items:center;gap:8px;margin:18px 0 4px}
.seasonnav select{padding:9px 14px;border-radius:999px;border:1px solid var(--line);font:inherit;font-weight:600;background:#fff}
.seasonnav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer}
.seasonnav button:disabled{opacity:.3;cursor:default}
.seasonnav .count{margin:0 0 0 8px}
.posh{font-family:Anton,sans-serif;font-weight:400;font-size:20px;margin:22px 0 10px;letter-spacing:.3px}
.mini .no{position:absolute;top:5px;left:5px;background:var(--gold);color:var(--ink);font-family:Anton;font-size:13px;padding:1px 7px;border-radius:4px;z-index:1}
.navlink{color:#fff;text-decoration:none;font-weight:600;margin-left:auto}
.navlink:hover{color:var(--gold)}
.cta{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:800;padding:12px 22px;border-radius:999px}
.leaguejump{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 12px}
.leaguejump a{font-size:13px;font-weight:600;text-decoration:none;padding:5px 12px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.league{margin-top:28px;scroll-margin-top:80px}
.league h2{font-family:Anton,sans-serif;font-weight:400;font-size:26px;margin:0 0 12px;border-bottom:3px solid var(--ink);padding-bottom:4px}
.league h2 span{font-family:Inter;font-size:13px;color:var(--muted);font-weight:600;margin-left:8px}
.clubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.club{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-decoration:none;font-weight:600;font-size:14px}
.club:hover{border-color:var(--ink)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
@media(max-width:760px){.profile,.grid2{grid-template-columns:1fr}.sticker{position:static;max-width:300px;margin:0 auto}header{padding:12px 16px}main{padding:24px 16px}}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/">GOT GOT <span>NEED</span></a>
  <div class="search"><input id="q" placeholder="Search any player or club…" autocomplete="off"><div class="results" id="res"></div></div>
  <a class="navlink" href="#/clubs">Clubs</a>
</header>
<main id="app"></main>
<footer>Data: <a href="https://www.wikidata.org">Wikidata</a> (CC0) · Bios: Wikipedia (CC BY-SA) · Photos: Wikimedia Commons (credited per image)</footer>

<script>
const WD='https://www.wikidata.org/w/api.php';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=(base,params)=>fetch(base+'?'+new URLSearchParams({...params,format:'json',origin:'*'})).then(r=>r.json());

/* ---------- search ---------- */
const q=document.getElementById('q'),res=document.getElementById('res');let t,sel=-1;
q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(doSearch,200)});
q.addEventListener('keydown',e=>{const items=[...res.querySelectorAll('a')];if(!items.length)return;
  if(e.key==='ArrowDown'){sel=Math.min(sel+1,items.length-1)}else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0)}
  else if(e.key==='Enter'){(items[sel]||items[0]).click();return}else return;
  e.preventDefault();items.forEach((a,i)=>a.classList.toggle('sel',i===sel))});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))res.style.display='none'});
async function doSearch(){
  const s=q.value.trim();if(s.length<2){res.style.display='none';return}
  const d=await api(WD,{action:'wbsearchentities',search:s,language:'en',type:'item',limit:12});
  // keep likely sports people
  const hits=(d.search||[]).filter(h=>/player|footballer|athlete|cricketer|tennis|golfer|boxer|racing|driver|sprinter|swimmer|cyclist|coach|manager|basketball|rugby|baseball|hockey|sport|football club|club|team/i.test(h.description||'')).slice(0,7);
  sel=-1;
  res.innerHTML=hits.length?hits.map(h=>`<a href="#/${/club|team/i.test(h.description||'')&&!/player|footballer/i.test(h.description||'')?'team':'player'}/${h.id}">${esc(h.label)}<small>${esc(h.description)}</small></a>`).join(''):'<a class="muted">No sports people found</a>';
  res.style.display='block';
}
res.addEventListener('click',()=>{res.style.display='none';q.value=''});

/* ---------- home ---------- */
const FEATURED=[['Q10520','David Beckham'],['Q11571','Cristiano Ronaldo'],['Q615','Lionel Messi'],['Q163366','Zlatan Ibrahimović'],['Q36159','LeBron James'],['Q11459','Serena Williams'],['Q2426153','Sam Kerr']];
function home(){
  app.innerHTML=`<div class="hero"><h1>WHO PLAYED<br>FOR WHO?</h1>
  <p>Every player. Every club. Every season.</p>
  <p style="margin:20px 0 0"><a class="cta" href="#/clubs">Browse every club in England →</a></p>
  <div class="chips">${FEATURED.map(([id,n])=>`<a class="chip" href="#/player/${id}">${n}</a>`).join('')}</div></div>
  <div class="grid2">
    <div class="panel"><h2>Latest news</h2><p class="muted">The news feed goes here. Use a licensed news API (e.g. NewsAPI, GNews or a sports-data provider's news endpoint) behind a small server. Scraped BBC or Sky feeds can't legally be republished in a commercial app.</p></div>
    <div class="panel"><h2>How it works</h2><p class="muted">Search any athlete. Career data comes live from Wikidata (free to use commercially), photos from Wikimedia Commons with the photographer credited, and bios from Wikipedia.</p></div>
  </div>`;
}

/* ---------- profile ---------- */
const claims=(e,p)=>(e.claims?.[p]||[]).filter(c=>c.rank!=='deprecated'&&c.mainsnak.datavalue);
const val=c=>c.mainsnak.datavalue.value;
const qual=(c,p)=>c.qualifiers?.[p]?.[0]?.datavalue?.value;
const yr=t=>t?.time?parseInt(t.time.slice(0,5)):null;
const date=t=>{if(!t)return'';const[y,m,d]=t.time.slice(1,11).split('-');return t.precision>=11?new Date(Date.UTC(y,m-1,d)).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):y};
function colour(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return`hsl(${h} 55% 38%)`}
function initials(s){return s.replace(/\b(F\.?C\.?|A\.?F\.?C\.?|C\.?F\.?|S\.?C\.?|club|de|del|football|national|team|men's|association|soccer)\b/gi,'').trim().split(/\s+/).filter(w=>/[A-Za-z]/.test(w)).map(w=>w[0]).join('').slice(0,3).toUpperCase()}

async function labels(ids){
  const out={};ids=[...new Set(ids)];
  for(let i=0;i<ids.length;i+=50){
    const d=await api(WD,{action:'wbgetentities',ids:ids.slice(i,i+50).join('|'),props:'labels|claims',languages:'en|en-gb|es|fr|de|it'});
    for(const[id,e]of Object.entries(d.entities||{})){const label=e.labels?.en?.value||Object.values(e.labels||{})[0]?.value||'';out[id]={label,national:/national|under-\d|\bU-?\d\d\b|olympic/i.test(label)||claims(e,'P31').some(c=>['Q6979593','Q1194951','Q23905105','Q24704727'].includes(val(c).id))}}
  }return out;
}

// A player profile, in the same shape as data/players/<id>.json from the nightly copy:
// {id,name,desc,wiki,bio,img,credit:{artist,license},num,facts:[[k,v]],teams:[{id,label,s,e,apps,goals,loan,national}],awards:[{label,y}]}
async function livePlayer(id){
  const d=await api(WD,{action:'wbgetentities',ids:id,props:'labels|descriptions|claims|sitelinks',languages:'en',sitefilter:'enwiki'});
  const e=d.entities?.[id];if(!e||e.missing!==undefined)return null;
  const ref=p=>claims(e,p).map(c=>val(c).id).filter(Boolean);
  const teams=claims(e,'P54'),awards=claims(e,'P166');
  const L=await labels([...ref('P19'),...ref('P27'),...ref('P1532'),...ref('P413'),...ref('P641'),...teams.map(c=>val(c).id),...awards.map(c=>val(c).id)]);
  const lab=id=>L[id]?.label||'';
  const P={id,name:e.labels?.en?.value||id,desc:e.descriptions?.en?.value||'',wiki:e.sitelinks?.enwiki?.title||null,bio:'',img:null,credit:null};
  const img=claims(e,'P18')[0];
  if(img){P.img=val(img);
    try{const m=await api('https://commons.wikimedia.org/w/api.php',{action:'query',titles:'File:'+P.img,prop:'imageinfo',iiprop:'extmetadata',iiextmetadatafilter:'Artist|LicenseShortName'});
      const md=Object.values(m.query.pages)[0].imageinfo[0].extmetadata;P.credit={artist:(md.Artist?.value||'').replace(/<[^>]+>/g,'').trim(),license:md.LicenseShortName?.value||''}}catch{}}
  if(P.wiki){try{const s=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(P.wiki)).then(r=>r.json());P.bio=s.extract||''}catch{}}
  P.teams=teams.map(c=>({id:val(c).id,label:lab(val(c).id),national:!!L[val(c).id]?.national,s:yr(qual(c,'P580')),e:yr(qual(c,'P582')),
    apps:qual(c,'P1350')?parseInt(qual(c,'P1350').amount):null,goals:qual(c,'P1351')?parseInt(qual(c,'P1351').amount):null,
    loan:!!c.qualifiers?.P1642?.some(x=>x.datavalue?.value?.id==='Q2914547')}));
  P.awards=awards.map(c=>({label:lab(val(c).id),y:yr(qual(c,'P585'))}));
  const born=claims(e,'P569')[0],h=claims(e,'P2048')[0];
  const height=h?(()=>{const v=val(h),a=parseFloat(v.amount);return v.unit.endsWith('Q11573')?a.toFixed(2)+' m':a+' cm'})():'';
  P.facts=[['Born',born?date(val(born)):''],['Birthplace',lab(ref('P19')[0])],['Nation',lab(ref('P1532')[0]||ref('P27')[0])],['Position',ref('P413').map(lab).slice(0,2).join(', ')],['Height',height],['Sport',lab(ref('P641')[0])]].filter(f=>f[1]);
  const num=claims(e,'P1618')[0];P.num=num?String(val(num)):null;
  return P;
}

async function profile(id){
  app.innerHTML='<div class="loading">Opening the sticker packet…</div>';
  // 1) the nightly copy (instant), 2) live from Wikidata/Wikipedia for anyone not copied yet
  let P=null;try{const r=await fetch(`data/players/${id}.json`);if(r.ok)P=await r.json()}catch{}
  P??=await livePlayer(id);
  if(!P){app.innerHTML='<div class="loading">Player not found.</div>';return}
  if(!location.hash.includes(id))return;   // user moved on while loading
  document.title=P.name+' · Got Got Need';
  const photo=P.img&&`https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(P.img)}?width=500`;
  const credit=P.img&&`Photo: ${esc(P.credit?.artist||'Unknown')}${P.credit?.license?` · ${esc(P.credit.license)}`:''} · <a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(P.img)}" target="_blank">source</a>`;
  const rows=[...(P.teams||[])].sort((a,b)=>(a.s??9999)-(b.s??9999));
  const clubs=rows.filter(r=>!r.national),intl=rows.filter(r=>r.national);
  const n=x=>x==null?'–':x;
  const table=list=>`<table><tr><th>Years</th><th>Team</th><th class="n">Apps</th><th class="n">Goals</th></tr>${list.map(r=>`<tr>
    <td>${r.s??'?'}–${r.e??(r.s?'':'?')}</td>
    <td class="team"><span class="crest" style="background:${colour(r.label)}">${esc(initials(r.label))}</span><a href="#/team/${r.id}">${esc(r.label)}</a>${r.loan?'<span class="loan">loan</span>':''}</td>
    <td class="n">${n(r.apps)}</td><td class="n">${n(r.goals)}</td></tr>`).join('')}</table>`;
  const awards=[...(P.awards||[])].filter(a=>a.label).sort((a,b)=>(b.y||0)-(a.y||0));

  app.innerHTML=`<div class="profile">
   <div><div class="sticker"><div class="frame">
      ${photo?`<img class="photo" src="${photo}" alt="${esc(P.name)}">`:`<div class="nophoto">${esc(initials(P.name))}</div>`}
      ${P.num?`<span class="num">#${esc(P.num)}</span>`:''}
    </div><div class="banner">${esc(P.name)}</div>
    <div class="facts">${(P.facts||[]).map(([k,v])=>`<b>${k}</b><span>${esc(v)}</span>`).join('')}</div>
    ${credit?`<div class="credit">${credit}</div>`:''}</div></div>
   <div>
    <h1 class="name">${esc(P.name)}</h1><div class="desc">${esc(P.desc)}</div>
    ${P.bio?`<p class="bio">${esc(P.bio)}</p><p class="muted" style="font-size:12px">From <a href="https://en.wikipedia.org/wiki/${encodeURIComponent(P.wiki)}" target="_blank">Wikipedia</a>, CC BY-SA</p>`:''}
    ${clubs.length?`<div class="section"><h2>Clubs</h2>${table(clubs)}</div>`:''}
    ${intl.length?`<div class="section"><h2>International</h2>${table(intl)}</div>`:''}
    ${!rows.length?'<p class="muted">No team history recorded yet.</p>':''}
    ${awards.length?`<div class="section"><h2>Honours & awards</h2><div class="awards">${awards.map(a=>`<div class="award">${a.y?`<b>${a.y}</b> `:''}${esc(a.label)}</div>`).join('')}</div></div>`:''}
   </div></div>`;
}


/* ---------- team ---------- */
const sparql=query=>fetch('https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(query),{headers:{Accept:'application/sparql-results+json'}}).then(r=>{if(!r.ok)throw new Error('Wikidata query service busy, try again');return r.json()});
const NOW=new Date(),CUR=NOW.getUTCMonth()>=6?NOW.getUTCFullYear():NOW.getUTCFullYear()-1; // season starts in July
const seasonLabel=y=>`${y}–${String(y+1).slice(-2)}`;
// Turn a Wikidata date into the season it falls in. Year-only dates: a start year means
// joining that summer, an end year means leaving at the end of the previous season.
function seasonOf(v,prec,isEnd){if(!v)return null;const y=+v.slice(0,4),m=+v.slice(5,7);return prec>=10?(m>=7?y:y-1):(isEnd?y-1:y)}
function span(sp){let a=sp.fs,b=sp.ls;if(a==null&&b==null)return null;if(a==null)a=b;
  if(b==null)b=CUR-a<=6?CUR:a;   // no end date: still there if they joined recently, otherwise unknown
  if(b<a)a=b;return[a,b]}
const POS=[['Goalkeepers',/goal/i],['Defenders',/back|defend|sweeper|libero/i],['Midfielders',/midfield|playmaker/i],['Forwards',/forward|striker|wing|attack/i]];
const posGroup=p=>{for(const[g,r]of POS)if(p.pos.some(x=>r.test(x)))return g;return'Other'};
const yrs=x=>!x.s?'':x.e==null?`${x.s}–`:x.e===x.s?`${x.s}`:`${x.s}–${String(x.e).slice(-2)}`;
const teamCache={};

async function loadTeam(id){
  if(teamCache[id])return teamCache[id];
  // 1) the nightly copy in data/teams/ (instant)
  try{const r=await fetch(`data/teams/${id}.json`);if(r.ok){const c=await r.json();
    const rows=c.rows.map(([p,pLabel,start,sp,end,ep,apps,goals,img,posLabel])=>({p,pLabel,start,sp,end,ep,apps,goals,img,posLabel}));
    return teamCache[id]={...buildTeam(id,c.name,c.facts,rows),wiki:c.wiki,ws:c.ws||{},wikiFrom:c.wikiFrom,built:c.built}}}catch{}
  // 2) live from Wikidata (clubs not in the copy yet)
  const [d,s]=await Promise.all([
    api(WD,{action:'wbgetentities',ids:id,props:'labels|claims|sitelinks',languages:'en',sitefilter:'enwiki'}),
    sparql(SQUAD_QUERY(id))]);
  const e=d.entities[id],name=e.labels?.en?.value||id;
  const ref=p=>claims(e,p).map(c=>val(c).id).filter(Boolean);
  const L=await labels([...ref('P17'),...ref('P115'),...ref('P118')]);const lab=x=>L[x]?.label||'';
  const founded=claims(e,'P571')[0];
  const facts=[['Founded',founded?date(val(founded)):''],['Ground',lab(ref('P115').at(-1))],['League',lab(ref('P118').at(-1))],['Country',lab(ref('P17')[0])]].filter(f=>f[1]);
  const rows=s.results.bindings.map(b=>({p:b.p.value.split('/').pop(),pLabel:b.pLabel.value,start:b.start?.value,sp:b.sp?.value,end:b.end?.value,ep:b.ep?.value,
    apps:b.apps?.value,goals:b.goals?.value,img:b.img?.value,posLabel:b.posLabel?.value}));
  return teamCache[id]={...buildTeam(id,name,facts,rows),wiki:e.sitelinks?.enwiki?.title};
}
const SQUAD_QUERY=id=>`SELECT ?p ?pLabel ?start ?sp ?end ?ep ?apps ?goals ?img ?posLabel WHERE {
      ?p p:P54 ?st. ?st ps:P54 wd:${id}.
      OPTIONAL{?st pqv:P580 [wikibase:timeValue ?start; wikibase:timePrecision ?sp]}
      OPTIONAL{?st pqv:P582 [wikibase:timeValue ?end; wikibase:timePrecision ?ep]}
      OPTIONAL{?st pq:P1350 ?apps} OPTIONAL{?st pq:P1351 ?goals}
      OPTIONAL{?p wdt:P18 ?img} OPTIONAL{?p wdt:P413 ?pos}
      SERVICE wikibase:label{bd:serviceParam wikibase:language "en,es,fr,de,it".}}`;
// one row per player-spell-photo-position -> one entry per player with their spells at the club
function buildTeam(id,name,facts,rows){
  const players={};
  for(const b of rows){
    const pid=b.p,lbl=b.pLabel;if(!lbl||/^Q\d+$/.test(lbl))continue;
    const pl=players[pid]??={id:pid,name:lbl,img:b.img,pos:new Set(),spells:{}};
    if(b.posLabel&&!/^Q\d+$/.test(b.posLabel))pl.pos.add(b.posLabel);
    const st=b.start,en=b.end,k=st+'|'+en;
    if(!pl.spells[k]){const sp={s:st?+st.slice(0,4):null,e:en?+en.slice(0,4):null,fs:seasonOf(st,+b.sp,false),ls:seasonOf(en,+b.ep,true),
      apps:b.apps!=null?+b.apps:null,goals:b.goals!=null?+b.goals:null};[sp.a,sp.b]=span(sp)||[];pl.spells[k]=sp}
  }
  const list=Object.values(players).map(p=>{const sp=Object.values(p.spells).sort((a,b)=>(a.s??9999)-(b.s??9999));p.pos=[...p.pos];
    return{...p,group:posGroup(p),spells:sp,first:sp.find(x=>x.s)?.s??null,last:Math.max(...sp.map(x=>x.e??x.s??0))||null,
      apps:sp.some(x=>x.apps!=null)?sp.reduce((t,x)=>t+(x.apps||0),0):null,goals:sp.some(x=>x.goals!=null)?sp.reduce((t,x)=>t+(x.goals||0),0):null}});
  const firstSeason=Math.min(...list.flatMap(p=>p.spells.map(x=>x.a).filter(x=>x!=null)),CUR);
  return{id,name,facts,list,firstSeason};
}

function card(p,sp){
  const meta=sp?`${yrs(sp)||'?'}${sp.apps!=null?` · ${sp.apps} apps`:''}${sp.goals?` · ${sp.goals} gls`:''}`
    :`${p.spells.map(yrs).filter(Boolean).join(', ')||'Years unknown'}${p.apps!=null?` · ${p.apps} apps`:''}${p.goals?` · ${p.goals} gls`:''}`;
  return`<a class="mini" href="#/player/${p.id}"><div class="ph" style="background:${colour(p.name)}">${p.img?`<img loading="lazy" src="${p.img.replace('http://','https://')}?width=200" alt="" onerror="this.parentNode.textContent='${esc(initials(p.name)).replace(/'/g,'')}'">`:esc(initials(p.name))}</div>
    <div class="nm">${esc(p.name)}</div><div class="yr">${esc(meta)}${sp?.loan?' · loan':''}</div></a>`;
}

async function team(id,view){
  if(!teamCache[id])app.innerHTML='<div class="loading">Rounding up the squad…</div>';
  const T=await loadTeam(id);document.title=T.name+' · Got Got Need';
  const season=view==='all'?null:view?+view:CUR,tab=view==='all'?'all':season===CUR?'current':'season';
  app.innerHTML=`<div class="thead"><div class="bigcrest" style="background:${colour(T.name)}">${esc(initials(T.name))}</div>
    <div><h1>${esc(T.name)}</h1><div class="tfacts">${T.facts.map(([k,v])=>`<span><b>${k}</b>${esc(v)}</span>`).join('')}<span><b>All-time players</b>${T.list.length}</span></div></div></div>
    <nav class="tabs"><a class="${tab==='current'?'on':''}" href="#/team/${id}">Current squad</a><a class="${tab==='season'?'on':''}" href="#/team/${id}/${CUR-1}">Season by season</a><a class="${tab==='all'?'on':''}" href="#/team/${id}/all">All-time</a></nav>
    <div id="tv"></div>
    <p class="muted" style="font-size:12px;margin-top:24px">Squads are built from the dates players joined and left, as recorded on Wikidata, and include loans. Photos from Wikimedia Commons. Photographer and licence are credited on each player's page.${T.built?` Data copied ${date({time:'+'+T.built.slice(0,10),precision:11})}.`:''}</p>`;
  const tv=document.getElementById('tv');
  season==null?allTime(T,tv):await seasonView(T,season,tv);
}

async function seasonView(T,Y,tv){
  const opts=[];for(let y=CUR;y>=T.firstSeason;y--)opts.push(`<option value="${y}"${y===Y?' selected':''}>${seasonLabel(y)}${y===CUR?' (current)':''}</option>`);
  const go=y=>location.hash=`#/team/${T.id}${y===CUR?'':'/'+y}`;
  const nav=n=>`<div class="seasonnav"><button id="sprev" ${Y<=T.firstSeason?'disabled':''} aria-label="Previous season">‹</button>
      <select id="ssel">${opts.join('')}</select><button id="snext" ${Y>=CUR?'disabled':''} aria-label="Next season">›</button>
      <span class="count">${n}</span></div>`;
  tv.innerHTML=nav('Loading squad…');
  const order=[...POS.map(x=>x[0]),'Other'];
  // 1) Wikipedia squad list as it stood that season (best for recent years)
  let ws=null;try{ws=await wikiSquad(T,Y)}catch{}
  if(ws){
    tv.innerHTML=nav(`${ws.players.length} players`)+order.map(g=>[g,ws.players.filter(p=>p.group===g).sort((a,b)=>(+a.no||99)-(+b.no||99))]).filter(g=>g[1].length)
      .map(([g,ps])=>`<h3 class="posh">${g}</h3><div class="squad">${ps.map(wcard).join('')}</div>`).join('')
      +`<p class="muted" style="font-size:12px;margin-top:16px">Squad list from the <a href="https://en.wikipedia.org/w/index.php?oldid=${ws.revid}" target="_blank">Wikipedia article as of ${date({time:'+'+ws.asOf,precision:11})}</a>, CC BY-SA.</p>`;
  }else{
  // 2) fall back to Wikidata join/leave dates (best for older seasons)
  const squad=T.list.map(p=>({p,sp:p.spells.find(x=>x.a!=null&&x.a<=Y&&x.b>=Y)})).filter(x=>x.sp);
  const groups=order.map(g=>[g,squad.filter(x=>x.p.group===g).sort((a,b)=>(b.sp.apps??-1)-(a.sp.apps??-1)||a.p.name.localeCompare(b.p.name))]).filter(g=>g[1].length);
  tv.innerHTML=nav(`${squad.length} player${squad.length===1?'':'s'}`)
    +(groups.map(([g,ps])=>`<h3 class="posh">${g}</h3><div class="squad">${ps.map(x=>card(x.p,x.sp)).join('')}</div>`).join('')
      ||`<p class="muted">No players recorded for ${seasonLabel(Y)}. Coverage gets patchy for some seasons and lower leagues.</p>`);
  }
  if(!location.hash.startsWith('#/team/'+T.id))return;
  document.getElementById('ssel').onchange=e=>go(+e.target.value);
  document.getElementById('sprev').onclick=()=>go(Y-1);
  document.getElementById('snext').onclick=()=>go(Y+1);
}

function allTime(T,tv){
  const list=T.list,decs=[...new Set(list.filter(p=>p.first).map(p=>Math.floor(p.first/10)*10))].sort((a,b)=>b-a);
  tv.innerHTML=`<div class="controls"><input id="tf" placeholder="Filter players by name…"><select id="ts">
      <option value="recent">Newest first</option><option value="oldest">Oldest first</option><option value="apps">Most appearances</option><option value="goals">Most goals</option><option value="name">A–Z</option></select></div>
    <div class="decades" id="td"><button class="on" data-d="">All</button>${decs.map(x=>`<button data-d="${x}">${x}s</button>`).join('')}</div>
    <p class="count" id="tc"></p><div class="squad" id="sq"></div>`;
  let dec='';const tf=document.getElementById('tf'),ts=document.getElementById('ts');
  const sorters={recent:(a,b)=>(b.last??0)-(a.last??0),oldest:(a,b)=>(a.first??9999)-(b.first??9999),apps:(a,b)=>(b.apps??-1)-(a.apps??-1),goals:(a,b)=>(b.goals??-1)-(a.goals??-1),name:(a,b)=>a.name.localeCompare(b.name)};
  function draw(){
    const f=tf.value.trim().toLowerCase();
    const shown=list.filter(p=>(!f||p.name.toLowerCase().includes(f))&&(!dec||p.spells.some(x=>x.s&&(x.e??x.s)>=+dec&&x.s<=+dec+9))).sort(sorters[ts.value]);
    document.getElementById('tc').textContent=`${shown.length} player${shown.length===1?'':'s'}`+(shown.length>300?' · showing first 300, narrow it down with the filters':'');
    document.getElementById('sq').innerHTML=shown.slice(0,300).map(p=>card(p)).join('')||'<p class="muted">No players match.</p>';
  }
  tf.oninput=draw;ts.onchange=draw;
  document.getElementById('td').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;dec=b.dataset.d;
    document.querySelectorAll('#td button').forEach(x=>x.classList.toggle('on',x===b));
    if(dec&&ts.value==='recent')ts.value='apps';draw()};
  draw();
}

/* ---------- squads from Wikipedia club articles ({{Fs player}} templates) ---------- */
const WP='https://en.wikipedia.org/w/api.php';
// find the template starting at i and return its full text (handles nested {{ }})
function grabTemplate(s,i){let d=0;for(let j=i;j<s.length-1;j++){if(s[j]==='{'&&s[j+1]==='{'){d++;j++}else if(s[j]==='}'&&s[j+1]==='}'){d--;j++;if(!d)return s.slice(i,j+1)}}return null}
function splitParams(t){const out=[];let d=0,cur='';for(let j=2;j<t.length-2;j++){const c=t[j],n=t[j+1];
  if((c==='{'&&n==='{')||(c==='['&&n==='[')){d++;cur+=c+n;j++;continue}
  if((c==='}'&&n==='}')||(c===']'&&n===']')){d--;cur+=c+n;j++;continue}
  if(c==='|'&&!d){out.push(cur);cur='';continue}cur+=c}out.push(cur);
  const p={};out.slice(1).forEach(x=>{const k=x.indexOf('=');if(k>0)p[x.slice(0,k).trim().toLowerCase()]=x.slice(k+1).trim()});return p}
const plain=s=>(s||'').replace(/\{\{[^{}]*\}\}/g,'').replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g,'$1').replace(/<[^>]+>|'''?/g,'').replace(/\s+/g,' ').trim();
function parseName(v){
  let m=v.match(/\{\{\s*sort\s*name\s*\|([^|}]+)\|([^|}]+)(?:\|([^|}]+))?/i);if(m)return{name:(m[1]+' '+m[2]).trim(),title:(m[3]||m[1]+' '+m[2]).trim()};
  m=v.match(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/);if(m)return{name:(m[2]||m[1]).trim(),title:m[1].trim()};
  return{name:plain(v),title:null}}
const POSMAP={GK:'Goalkeepers',DF:'Defenders',MF:'Midfielders',FW:'Forwards'};

async function wikiSquad(T,Y){
  T.ws??={};if(Y in T.ws)return T.ws[Y];if(T.wikiFrom!=null&&Y<T.wikiFrom)return null;T.ws[Y]=null;if(!T.wiki)return null;
  const params={action:'query',prop:'revisions',rvprop:'content|timestamp|ids',rvslots:'main',titles:T.wiki,redirects:1,formatversion:2,rvlimit:1};
  if(Y!==CUR)Object.assign(params,{rvstart:`${Y}-11-01T00:00:00Z`,rvdir:'older'}); // squad after the summer window closed
  const r=await api(WP,params),rev=r.query?.pages?.[0]?.revisions?.[0];if(!rev)return null;
  const txt=rev.slots?.main?.content||'',a=txt.search(/\{\{\s*(?:fs|football squad)\s*start/i);if(a<0)return null;
  const b=txt.slice(a).search(/\{\{\s*(?:fs|football squad)\s*end/i),block=txt.slice(a,b<0?a+30000:a+b);
  const players=[];
  for(const m of block.matchAll(/\{\{\s*(?:fs\s*player|football squad player)\s*\|/gi)){
    const t=grabTemplate(block,m.index);if(!t)continue;const p=splitParams(t);if(!p.name)continue;
    players.push({...parseName(p.name),no:plain(p.no),pos:(p.pos||'').toUpperCase(),other:plain(p.other)});
  }
  if(players.length<8)return null;
  // map Wikipedia titles -> Wikidata ids -> photos
  const titles=[...new Set(players.map(p=>p.title).filter(Boolean))],qid={};
  for(let i=0;i<titles.length;i+=50){
    const q=await api(WP,{action:'query',titles:titles.slice(i,i+50).join('|'),redirects:1,prop:'pageprops',ppprop:'wikibase_item',formatversion:2});
    const hop={};for(const x of[...(q.query.normalized||[]),...(q.query.redirects||[])])hop[x.from]=x.to;
    const byTitle={};for(const pg of q.query.pages||[])if(pg.pageprops?.wikibase_item)byTitle[pg.title]=pg.pageprops.wikibase_item;
    for(const t of titles.slice(i,i+50)){let u=t;for(let k=0;k<3&&hop[u];k++)u=hop[u];if(byTitle[u])qid[t]=byTitle[u]}
  }
  const ids=[...new Set(Object.values(qid))],img={};
  for(let i=0;i<ids.length;i+=50){const d=await api(WD,{action:'wbgetentities',ids:ids.slice(i,i+50).join('|'),props:'claims'});
    for(const[id,e]of Object.entries(d.entities||{})){const c=claims(e,'P18')[0];if(c)img[id]='https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(val(c))}}
  for(const p of players){p.id=qid[p.title]||null;p.img=p.id&&img[p.id];p.group=POSMAP[p.pos]||'Other'}
  return T.ws[Y]={players,asOf:rev.timestamp.slice(0,10),revid:rev.revid};
}

function wcard(p){
  const ph=`<div class="ph" style="background:${colour(p.name)}">${p.no?`<span class="no">${esc(p.no)}</span>`:''}${p.img?`<img loading="lazy" src="${p.img}?width=200" alt="" onerror="this.replaceWith(document.createTextNode('${esc(initials(p.name)).replace(/'/g,'')}'))">`:esc(initials(p.name))}</div>`;
  const body=`${ph}<div class="nm">${esc(p.name)}</div><div class="yr">${esc(p.pos)}${p.other?` · ${esc(p.other)}`:''}</div>`;
  return p.id?`<a class="mini" href="#/player/${p.id}">${body}</a>`:`<div class="mini">${body}</div>`;
}

/* ---------- every English club, by division ---------- */
// Club lists come from the league tables on Wikipedia (Module:Sports table "name_XXX=[[Club]]" entries).
const LEAGUES=[
  ['Premier League','Tier 1',s=>`${s} Premier League`],
  ['Championship','Tier 2',s=>`${s} EFL Championship`],
  ['League One','Tier 3',s=>`${s} EFL League One`],
  ['League Two','Tier 4',s=>`${s} EFL League Two`],
  ['National League','Tier 5',s=>`Template:${s} National League table`],
  ['National League North','Tier 6',s=>`Template:${s} National League North table`],
  ['National League South','Tier 6',s=>`Template:${s} National League South table`]];

async function englishClubs(){
  const key='ggn-clubs2-'+CUR;
  try{const r=await fetch('data/clubs.json');if(r.ok){const j=await r.json();if(j.season===CUR)return j.leagues}}catch{}
  try{const c=JSON.parse(localStorage.getItem(key)||'null');if(c&&Date.now()-c.t<864e5)return c.data}catch{}
  const fetchPages=async titles=>{const r=await api(WP,{action:'query',prop:'revisions',rvprop:'content',rvslots:'main',titles:titles.join('|'),redirects:1,formatversion:2});
    const hop={};for(const x of[...(r.query.normalized||[]),...(r.query.redirects||[])])hop[x.from]=x.to;
    const byT={};for(const p of r.query.pages||[])byT[p.title]=p.revisions?.[0]?.slots?.main?.content||'';
    return t=>{let u=t;for(let k=0;k<3&&hop[u];k++)u=hop[u];return byT[u]||''}};
  const parse=txt=>{const seen=new Set(),out=[];
    for(const m of txt.matchAll(/name_([^\s=|]+)\s*=\s*(?:\{\{\s*nowrap\s*\|\s*)?\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/gi)){if(seen.has(m[1]))continue;seen.add(m[1]);out.push({title:m[2].trim(),name:(m[3]||m[2]).replace(/\s*F\.C\.$/,'').trim()})}
    return out};
  // this season's tables; fall back to last season's if one isn't written yet
  let get=await fetchPages(LEAGUES.map(l=>l[2](seasonLabel(CUR))));
  const lists=[];for(const l of LEAGUES)lists.push(parse(get(l[2](seasonLabel(CUR)))));
  const missing=LEAGUES.map((l,i)=>lists[i].length?null:i).filter(i=>i!=null);
  if(missing.length){get=await fetchPages(missing.map(i=>LEAGUES[i][2](seasonLabel(CUR-1))));for(const i of missing)lists[i]=parse(get(LEAGUES[i][2](seasonLabel(CUR-1))))}
  // club article -> Wikidata id
  const titles=[...new Set(lists.flat().map(c=>c.title))],qid={};
  for(let i=0;i<titles.length;i+=50){
    const q=await api(WP,{action:'query',titles:titles.slice(i,i+50).join('|'),redirects:1,prop:'pageprops',ppprop:'wikibase_item',formatversion:2});
    const hop={};for(const x of[...(q.query.normalized||[]),...(q.query.redirects||[])])hop[x.from]=x.to;
    const byT={};for(const p of q.query.pages||[])if(p.pageprops?.wikibase_item)byT[p.title]=p.pageprops.wikibase_item;
    for(const t of titles.slice(i,i+50)){let u=t;for(let k=0;k<3&&hop[u];k++)u=hop[u];if(byT[u])qid[t]=byT[u]}
  }
  const data=LEAGUES.map(([name,tier],i)=>({name,tier,clubs:lists[i].map(c=>({...c,id:qid[c.title]})).filter(c=>c.id).sort((a,b)=>a.name.localeCompare(b.name))}));
  try{localStorage.setItem(key,JSON.stringify({t:Date.now(),data}))}catch{}
  return data;
}

async function clubsPage(){
  document.title='English clubs · Got Got Need';
  app.innerHTML='<div class="loading">Fetching the fixtures list…</div>';
  const data=await englishClubs();const total=data.reduce((t,l)=>t+l.clubs.length,0);
  app.innerHTML=`<div class="hero" style="padding:24px 0 8px"><h1 style="font-size:clamp(34px,6vw,56px)">EVERY CLUB IN ENGLAND</h1>
    <p>${total} clubs across the top six tiers, ${seasonLabel(CUR)} season. Pick one to see its current squad and every season back to the start.</p>
    <div class="controls" style="justify-content:center"><input id="cf" placeholder="Find a club…" style="max-width:420px"></div></div>
    <nav class="leaguejump">${data.map((l,i)=>`<a href="#" data-i="${i}">${l.name}</a>`).join('')}</nav>
    <div id="cl">${data.map((l,i)=>`<section class="league" id="lg${i}"><h2>${l.name} <span>${l.tier} · ${l.clubs.length} clubs</span></h2>
      <div class="clubgrid">${l.clubs.map(c=>`<a class="club" href="#/team/${c.id}" data-n="${esc(c.name.toLowerCase())}"><span class="crest" style="background:${colour(c.title.replace(/_/g,' '))}">${esc(initials(c.title.replace(/_/g,' ')))}</span>${esc(c.name)}</a>`).join('')}</div></section>`).join('')}</div>`;
  document.getElementById('cf').oninput=e=>{const f=e.target.value.trim().toLowerCase();
    document.querySelectorAll('.club').forEach(a=>a.style.display=!f||a.dataset.n.includes(f)?'':'none');
    document.querySelectorAll('.league').forEach(s=>s.style.display=[...s.querySelectorAll('.club')].some(a=>a.style.display!=='none')?'':'none')};
  document.querySelector('.leaguejump').onclick=e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();document.getElementById('lg'+a.dataset.i).scrollIntoView({behavior:'smooth'})};
}

/* ---------- router ---------- */
let lastPage='';
function route(){const fail=err=>app.innerHTML=`<div class="loading">Couldn't load: ${esc(err.message)}</div>`;
  let m;const page=location.hash.split('/').slice(0,3).join('/');if(page!==lastPage)window.scrollTo(0,0);lastPage=page;
  if(location.hash.startsWith('#/clubs'))clubsPage().catch(fail);
  else if(m=location.hash.match(/^#\/player\/(Q\d+)/))profile(m[1]).catch(fail);
  else if(m=location.hash.match(/^#\/team\/(Q\d+)(?:\/(\d{4}|all))?/))team(m[1],m[2]).catch(fail);
  else{document.title='Got Got Need';home()}}
addEventListener('hashchange',route);route();
</script>
